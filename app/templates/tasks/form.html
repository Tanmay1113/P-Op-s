{% extends "base.html" %}
{% block title %}New task{% endblock %}
{% block content %}
<div class="page-heading"><div><div class="eyebrow">TASK MANAGEMENT</div><h1>Assign a task</h1><p>Choose a project, owner, and clear deadline.</p></div></div>
<section class="panel form-panel"><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="title">Task title</label><input id="title" name="title" required maxlength="180"><label for="description">Description</label><textarea id="description" name="description" rows="4" maxlength="5000"></textarea><label for="project_id">Project</label><select id="project_id" name="project_id" required><option value="">Select a project</option>{% for project in projects %}<option value="{{ project.project_id }}">{{ project.name }}</option>{% endfor %}</select><label for="assigned_to">Assign to Employee</label><select id="assigned_to" name="assigned_to" required><option value="">Select an Employee</option>{% for employee in employees %}<option value="{{ employee.user_id }}">{{ employee.username }} · {{ employee.email }}</option>{% endfor %}</select><label for="deadline">Deadline (optional)</label><input id="deadline" name="deadline" type="date"><label for="status">Initial status</label><select id="status" name="status">{% for status in statuses %}<option value="{{ status }}" {% if status == 'Pending' %}selected{% endif %}>{{ status }}</option>{% endfor %}</select><div class="form-actions"><a class="button button-outline" href="{{ url_for('tasks.list_tasks') }}">Cancel</a><button class="button button-dark" type="submit">Create task</button></div></form></section>
{% endblock %}
