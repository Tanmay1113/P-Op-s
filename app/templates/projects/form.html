{% extends "base.html" %}
{% block title %}{{ 'Edit project' if project else 'New project' }}{% endblock %}
{% block content %}
<div class="page-heading"><div><div class="eyebrow">PROJECTS</div><h1>{{ 'Edit project' if project else 'Create a project' }}</h1><p>Keep the project name and status clear for everyone involved.</p></div></div>
<section class="panel form-panel"><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="name">Project name</label><input id="name" name="name" required maxlength="160" value="{{ project.name if project else '' }}"><label for="description">Description</label><textarea id="description" name="description" rows="4" maxlength="5000">{{ project.description if project else '' }}</textarea><label for="status">Status</label><select id="status" name="status">{% for status in statuses %}<option value="{{ status }}" {% if project and project.status == status %}selected{% elif not project and status == 'Active' %}selected{% endif %}>{{ status }}</option>{% endfor %}</select><div class="form-actions"><a class="button button-outline" href="{{ url_for('projects.list_projects') }}">Cancel</a><button class="button button-dark" type="submit">{{ 'Save changes' if project else 'Create project' }}</button></div></form></section>
{% endblock %}
