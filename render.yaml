services:
  - type: web
    name: poms
    runtime: docker
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: FLASK_DEBUG
        value: "false"
      - key: RATELIMIT_STORAGE_URI
        value: "memory://"
